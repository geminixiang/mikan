name: Publish Agent Sandbox images

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - src/**
      - tsconfig.json
      - tsconfig.build.json
      - docker/mikan.Dockerfile
      - docker/agent-sandbox-runtime/**
      - docker/agent-sandbox-router/**
      - vendor/agent-sandbox-sdk/**
      - package.json
      - package-lock.json
      - .github/workflows/agent-sandbox-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: mikan
            file: docker/mikan.Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: mikan-agent-sandbox-runtime
            file: docker/agent-sandbox-runtime/Dockerfile
            context: docker/agent-sandbox-runtime
            platforms: linux/amd64
          - name: mikan-agent-sandbox-router
            file: docker/agent-sandbox-router/Dockerfile
            context: docker/agent-sandbox-router
            platforms: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA::7}"
          tags=("${image}:sha-${short_sha}")
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tags+=("${image}:${version}")
            if [[ "${version}" == *-* ]]; then
              tags+=("${image}:beta")
            else
              tags+=("${image}:latest")
            fi
          else
            tags+=("${image}:edge")
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and publish chart
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          helm package deploy/helm/mikan \
            --version "$version" \
            --app-version "$version" \
            --destination dist
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          helm push "dist/mikan-${version}.tgz" "oci://ghcr.io/${owner}/charts"
