name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.19.0, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check format
        run: pnpm run fmt:check

      - name: Build
        run: pnpm run build

      - name: Build documentation
        run: pnpm run docs:build

      - name: Check unused code and dependencies
        run: pnpm run knip

      - name: Verify npm package
        run: node scripts/check-npm-package.mjs

      - name: Test with coverage check
        run: pnpm run test:coverage:check
