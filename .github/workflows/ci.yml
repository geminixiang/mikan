name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.15.0, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check format
        run: npm run fmt:check

      - name: Build
        run: npm run build

      - name: Type-check tests, e2e, and examples
        run: npm run typecheck

      - name: Build documentation
        run: npm run docs:build

      - name: Check unused code and dependencies
        run: npm run knip

      - name: Verify npm package
        run: node scripts/check-npm-package.mjs

      - name: Test with coverage check
        run: npm run test:coverage

  sandbox-engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman, nerdctl]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install nerdctl
        if: matrix.engine == 'nerdctl'
        env:
          NERDCTL_VERSION: 2.3.1
          NERDCTL_SHA256: 7a0d8efcf55b10b57d831541266adb9c6ec3d55b44ec041c95f6eb994d1faab9
        run: |
          archive="nerdctl-full-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/${archive}"
          echo "${NERDCTL_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local bin/nerdctl libexec/cni
          echo "ENGINE_PREFIX=sudo -E env PATH=$PATH" >> "$GITHUB_ENV"

      - name: Pull test images
        run: |
          $ENGINE_PREFIX ${{ matrix.engine }} --version
          for image in docker.io/library/debian:trixie-slim docker.io/library/alpine:latest; do
            $ENGINE_PREFIX ${{ matrix.engine }} pull -q "$image"
          done

      - name: Real-container sandbox tests
        env:
          CONTAINER_ENGINE: ${{ matrix.engine }}
        run: >-
          $ENGINE_PREFIX npx vitest run
          src/test/container-execution-env.test.ts
          src/test/container-exec-docker.test.ts
          src/test/container-provisioner-engine.test.ts
