name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.19.0, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check format
        run: npm run fmt:check

      - name: Build
        run: npm run build

      - name: Test with coverage check
        run: npm run test:coverage:check

  helm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Validate chart profiles
        run: scripts/check-helm-chart.sh

      - name: Build pinned router image
        run: docker build --file docker/agent-sandbox-router/Dockerfile docker/agent-sandbox-router
