name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify npm package
        run: node scripts/check-npm-package.mjs

      - name: Publish verified package to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Build and package verification already ran above. Skipping lifecycle
          # scripts avoids rebuilding dist after the verified package check.
          if [[ "$VERSION" == *-* ]]; then
            npm publish --ignore-scripts --provenance --access public --tag beta
          else
            npm publish --ignore-scripts --provenance --access public
          fi
