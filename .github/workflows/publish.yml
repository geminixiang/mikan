name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  worker-binaries:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Build mikan-worker release binaries
        working-directory: worker
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/mikan-worker_${TAG}_${os}_${arch}" ./cmd/mikan-worker
          done
          (cd dist && sha256sum mikan-worker_* > "mikan-worker_${TAG}_SHA256SUMS.txt")

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" worker/dist/* --clobber
