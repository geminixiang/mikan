name: Sandbox image

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - deploy/docker/mikan-sandbox.Dockerfile
      - scripts/smoke-sandbox-image.sh
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - deploy/docker/mikan-sandbox.Dockerfile
      - scripts/smoke-sandbox-image.sh
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/mikan-sandbox"
          version=$(node -p "require('./package.json').version")

          tags=("${image}:${version}")
          if [[ "${version}" != *-* ]]; then
            tags+=("${image}:latest")
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "inputs=$(sha256sum deploy/docker/mikan-sandbox.Dockerfile | cut -d' ' -f1)"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Reuse the published image when its Dockerfile is unchanged and fresh
        id: reuse
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INPUTS: ${{ steps.meta.outputs.inputs }}
          MAX_AGE_DAYS: "30"
        run: |
          set -euo pipefail

          if ! previous=$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{ (index .Image "linux/amd64").Created.Unix }}|{{ .Manifest.Digest }}|{{ index (index .Image "linux/amd64").Config.Labels "io.github.mikan.sandbox.inputs" }}'); then
            echo "No published image to reuse; building"
            echo "digest=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          IFS='|' read -r created digest inputs <<< "${previous}"
          age_days=$(( ( $(date +%s) - created ) / 86400 ))

          if [[ "${inputs}" == "${INPUTS}" && "${age_days}" -lt "${MAX_AGE_DAYS}" ]]; then
            echo "Reusing ${IMAGE}@${digest}: same Dockerfile, built ${age_days} days ago"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "Building: published inputs '${inputs:-none}' vs '${INPUTS}', built ${age_days} days ago"
            echo "digest=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sandbox image for smoke test
        if: github.event_name != 'release' || steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/mikan-sandbox.Dockerfile
          platforms: linux/amd64
          load: true
          tags: mikan-sandbox:smoke
          cache-from: type=gha

      - name: Smoke test sandbox image
        if: github.event_name != 'release' || steps.reuse.outputs.digest == ''
        run: scripts/smoke-sandbox-image.sh mikan-sandbox:smoke

      - name: Tag the reused image with this release
        if: github.event_name == 'release' && steps.reuse.outputs.digest != ''
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.reuse.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(--tag "${tag}"); done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Build and push sandbox image
        if: github.event_name == 'release' && steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/mikan-sandbox.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=mikan sandbox
            org.opencontainers.image.description=Prebuilt sandbox image for mikan managed per-user containers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            io.github.mikan.sandbox.inputs=${{ steps.meta.outputs.inputs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published tags
        if: github.event_name == 'release'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Published sandbox image" >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r tag; do
            echo "- \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"
