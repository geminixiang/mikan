name: Slack E2E

on:
  workflow_dispatch:

jobs:
  slack-e2e:
    runs-on: ubuntu-latest
    # The full suite runs well past ten minutes against a live model.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Slack E2E
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_QA_USER_TOKEN: ${{ secrets.SLACK_QA_USER_TOKEN }}
          SLACK_QA_CHANNEL_ID: ${{ secrets.SLACK_QA_CHANNEL_ID || vars.SLACK_QA_CHANNEL_ID }}
          SLACK_QA_BOT_USER_ID: ${{ secrets.SLACK_QA_BOT_USER_ID || vars.SLACK_QA_BOT_USER_ID }}
          SLACK_QA_WORKING_DIR: ${{ github.workspace }}/.workspace/mikan-workspace
          # Slower scenarios can take more than the 30s default wait before
          # the first tool call.
          SLACK_QA_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail

          WORKSPACE_TMP="$GITHUB_WORKSPACE/.workspace"
          LOG_FILE="$WORKSPACE_TMP/mikan-slack-e2e.log"
          MIKAN_HOME="$WORKSPACE_TMP/home"
          STATE_DIR="$MIKAN_HOME/.mikan"
          WORKING_DIR="$WORKSPACE_TMP/mikan-workspace"
          mkdir -p "$WORKING_DIR" "$MIKAN_HOME"

          HOME="$MIKAN_HOME" node dist/main.js onboard
          # E2E runs on OpenRouter's built-in openai/gpt-6-luna. Lane
          # history: deepseek-v4-flash echoed stale tokens from polluted
          # context; gpt-oss-120b's routing returned empty or corrupted
          # content; qwen3.7-flash omitted required tool parameters;
          # glm-5.3-flash sometimes wrote a tool result as text instead of
          # calling the tool, and answered with tokens from other threads.
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const model = { provider: "openrouter", model: "openai/gpt-6-luna" };
            s.llm = { ...s.llm, ...model, thinkingLevel: "off" };
            fs.writeFileSync(p, JSON.stringify(s, null, 2));
          ' "$STATE_DIR/settings.json"
          HOME="$MIKAN_HOME" node dist/main.js "$WORKING_DIR" >"$LOG_FILE" 2>&1 &
          MIKAN_PID=$!

          cleanup() {
            local exit_code=$?
            kill "$MIKAN_PID" 2>/dev/null || true
            wait "$MIKAN_PID" 2>/dev/null || true
            echo "----- mikan log -----"
            cat "$LOG_FILE" || true
            # Which conversations produced history distinguishes "event never
            # delivered" (no dir) from "delivered but not triggered" (dir, no run).
            echo "----- workspace conversations -----"
            find "$WORKING_DIR" -maxdepth 2 2>/dev/null | head -80 || true
            echo "----- scoped intake and persisted QA markers -----"
            node scripts/diagnose-slack-e2e.mjs "$WORKING_DIR" "$STATE_DIR" || true
            [ "$exit_code" -eq 0 ] && rm -rf "$WORKSPACE_TMP" || true
          }
          trap cleanup EXIT

          connected=0
          for _ in $(seq 1 60); do
            if grep -q "connected to Slack" "$LOG_FILE"; then
              connected=1
              break
            fi
            if ! kill -0 "$MIKAN_PID" 2>/dev/null; then
              echo "mikan exited before connecting"
              exit 1
            fi
            sleep 1
          done

          if [ "$connected" != "1" ]; then
            echo "Timed out waiting for mikan to connect to Slack"
            exit 1
          fi

          # The tests inspect the daemon's sessions, which live in its ~/.mikan.
          HOME="$MIKAN_HOME" npm run test:e2e:slack
