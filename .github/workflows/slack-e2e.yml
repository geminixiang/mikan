name: Slack E2E

on:
  workflow_dispatch:

jobs:
  slack-e2e:
    runs-on: ubuntu-latest
    # glm-5.3-flash reasons before most replies; the full suite runs well
    # past the 10 minutes the previous non-reasoning lane model needed.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Slack E2E
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The CI model rides a custom "openrouter-ci" provider (see the
          # models.json below); custom providers resolve their key from
          # <NAME>_API_KEY, so re-export the same secret under that name.
          OPENROUTER_CI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_QA_USER_TOKEN: ${{ secrets.SLACK_QA_USER_TOKEN }}
          SLACK_QA_CHANNEL_ID: ${{ secrets.SLACK_QA_CHANNEL_ID || vars.SLACK_QA_CHANNEL_ID }}
          SLACK_QA_BOT_USER_ID: ${{ secrets.SLACK_QA_BOT_USER_ID || vars.SLACK_QA_BOT_USER_ID }}
          SLACK_QA_WORKING_DIR: ${{ github.workspace }}/.workspace/mikan-workspace
          # glm-5.3-flash is a hybrid-reasoning model and can spend 30-40s
          # thinking before its first tool call on the slower scenarios; the
          # 30s default wait flakes on exactly those tests.
          SLACK_QA_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail

          WORKSPACE_TMP="$GITHUB_WORKSPACE/.workspace"
          LOG_FILE="$WORKSPACE_TMP/mikan-slack-e2e.log"
          STATE_DIR="$WORKSPACE_TMP/mikan-state"
          WORKING_DIR="$WORKSPACE_TMP/mikan-workspace"
          mkdir -p "$WORKING_DIR"

          node dist/main.js --onboard --state-dir "$STATE_DIR"
          # E2E runs on OpenRouter with glm-5.3-flash. Lane history:
          # deepseek-v4-flash echoed stale tokens from polluted context;
          # gpt-oss-120b's OpenRouter routing intermittently returned empty
          # or corrupted content (mandatory-reasoning endpoints + per-provider
          # harmony parsing); qwen3.7-flash intermittently omitted required
          # tool parameters (the `label` field), and the retries pushed slow
          # scenarios past their timeouts. The model is not in pi-ai's
          # built-in openrouter catalog — and a same-named custom provider is
          # shadowed by the built-in — so it rides a custom "openrouter-ci"
          # provider pointed at the same base URL.
          mkdir -p "$HOME/.mikan"
          cat > "$HOME/.mikan/models.json" <<'MODELS'
          {
            "providers": {
              "openrouter-ci": {
                "name": "OpenRouter (CI)",
                "api": "openai-completions",
                "baseUrl": "https://openrouter.ai/api/v1",
                "models": [
                  {
                    "id": "z-ai/glm-5.3-flash",
                    "name": "Z.AI: GLM 5.3 Flash",
                    "reasoning": true,
                    "contextWindow": 1310720,
                    "maxTokens": 131072,
                    "cost": { "input": 0.075, "output": 0.25, "cacheRead": 0, "cacheWrite": 0 }
                  }
                ]
              }
            }
          }
          MODELS
          # The runner is a disposable single-tenant workspace on the host
          # sandbox, so opt into the trusted door policy explicitly — the
          # isolated default refuses host mode by design.
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const model = { provider: "openrouter-ci", model: "z-ai/glm-5.3-flash" };
            s.llm = { ...s.llm, ...model, autoReply: { ...model } };
            s.sandbox = {
              ...s.sandbox,
              workspace: { doorPolicy: "trusted", layout: "shared-support" },
            };
            fs.writeFileSync(p, JSON.stringify(s, null, 2));
          ' "$STATE_DIR/settings.json"
          # The agent-pm example is exercised by S-023/S-024. Installed
          # globally so it activates in the QA conversation, and configured to
          # own its schedules there — but with every cron parked on an hour
          # this job will not see, so it never posts on its own while the other
          # tests are asserting on the channel. The tests drive it explicitly
          # through /pm instead.
          node dist/main.js ext install deploy/examples/extensions/agent-pm \
            --global --state-dir "$STATE_DIR"
          PARKED_HOUR="$(( ($(TZ=Asia/Taipei date +%-H) + 6) % 24 ))"
          AGENT_PM_DIR="$STATE_DIR/global/extension-data/agent-pm"
          mkdir -p "$AGENT_PM_DIR"
          cat > "$AGENT_PM_DIR/config.json" <<CONFIG
          {
            "controlConversationId": "$SLACK_QA_CHANNEL_ID",
            "deliveryMode": "test",
            "testConversationId": "$SLACK_QA_CHANNEL_ID",
            "githubOrg": "",
            "calendarId": "",
            "disabledSources": [],
            "heartbeatHour": null,
            "scheduleOverrides": {
              "ingest-events": "0 $PARKED_HOUR * * *",
              "run-workflows": "0 $PARKED_HOUR * * *",
              "sweep-tasks": "0 $PARKED_HOUR * * *"
            }
          }
          CONFIG

          node dist/main.js --state-dir "$STATE_DIR" "$WORKING_DIR" >"$LOG_FILE" 2>&1 &
          MIKAN_PID=$!

          cleanup() {
            local exit_code=$?
            kill "$MIKAN_PID" 2>/dev/null || true
            wait "$MIKAN_PID" 2>/dev/null || true
            echo "----- mikan log -----"
            cat "$LOG_FILE" || true
            # Which conversations produced history distinguishes "event never
            # delivered" (no dir) from "delivered but not triggered" (dir, no run).
            echo "----- workspace conversations -----"
            find "$WORKING_DIR" -maxdepth 2 2>/dev/null | head -80 || true
            echo "----- dm history -----"
            head -c 4000 "$WORKING_DIR"/D*/log.jsonl 2>/dev/null || true
            [ "$exit_code" -eq 0 ] && rm -rf "$WORKSPACE_TMP" || true
          }
          trap cleanup EXIT

          connected=0
          for _ in $(seq 1 60); do
            if grep -q "connected to Slack" "$LOG_FILE"; then
              connected=1
              break
            fi
            if ! kill -0 "$MIKAN_PID" 2>/dev/null; then
              echo "mikan exited before connecting"
              exit 1
            fi
            sleep 1
          done

          if [ "$connected" != "1" ]; then
            echo "Timed out waiting for mikan to connect to Slack"
            exit 1
          fi

          npm run test:e2e:slack
