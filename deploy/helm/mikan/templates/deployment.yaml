{{- if .Values.mikan.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mikan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mikan.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mikan.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mikan.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "mikan.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- if .Values.storage.fixOwnership }}
      initContainers:
        - name: prepare-volume-ownership
          image: {{ .Values.storage.ownershipImage }}
          command: ["sh", "-c", "chown 1000:1000 /var/lib/mikan /workspace"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: state
              mountPath: /var/lib/mikan
      {{- end }}
      containers:
        - name: mikan
          image: {{ include "mikan.image" (dict "root" . "image" .Values.mikan.image) }}
          imagePullPolicy: {{ .Values.mikan.image.pullPolicy }}
          args:
            - --state-dir=/var/lib/mikan
            - --sandbox={{ if eq .Values.mikan.sandbox.mode "agent-sandbox" }}agent-sandbox:{{ include "mikan.sandboxTemplateName" . }}{{ else }}host{{ end }}
            - /workspace
          envFrom:
            - secretRef:
                name: {{ required "secrets.mikanEnv.existingSecretName is required" .Values.secrets.mikanEnv.existingSecretName }}
          startupProbe:
            exec:
              command: ["sh", "-c", "test -w /var/lib/mikan && test -w /workspace && kill -0 1"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.mikan.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: state
              mountPath: /var/lib/mikan
            - name: settings
              mountPath: /var/lib/mikan/settings.json
              subPath: settings.json
              readOnly: true
            {{- with .Values.secrets.harnessAuth.existingSecretName }}
            - name: harness-auth
              mountPath: /home/node/.mikan/auth.json
              subPath: auth.json
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "mikan.workspaceClaim" . }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "mikan.stateClaim" . }}
        - name: settings
          configMap:
            name: {{ include "mikan.fullname" . }}-settings
        {{- with .Values.secrets.harnessAuth.existingSecretName }}
        - name: harness-auth
          secret:
            secretName: {{ . }}
            defaultMode: 0444
        {{- end }}
{{- end }}
