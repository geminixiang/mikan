{{- if and .Values.mikan.enabled .Values.agentSandbox.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mikan.fullname" . }}-agent-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mikan.labels" . | nindent 4 }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mikan.fullname" . }}-agent-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mikan.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mikan.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mikan.fullname" . }}-agent-sandbox
{{- end }}
