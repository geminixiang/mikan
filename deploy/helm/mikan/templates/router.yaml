{{- if .Values.router.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mikan.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mikan.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  template:
    metadata:
      labels:
        # The v0.5.2 extensions-managed NetworkPolicy selects this legacy label.
        app: sandbox-router
        app.kubernetes.io/name: sandbox-router
        app.kubernetes.io/component: sandbox-router
    spec:
      serviceAccountName: {{ include "mikan.routerName" . }}
      containers:
        - name: sandbox-router
          image: {{ include "mikan.image" (dict "root" . "image" .Values.router.image) }}
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          args:
            - --http-bind-address=:8080
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --cluster-domain=cluster.local
            - --proxy-timeout=180s
            - --upstream-max-retries=3
            # Direct-api clients use per-Sandbox Service DNS; no cluster-wide Pod RBAC needed.
            - --cache-enabled=false
          ports:
            - name: proxy
              containerPort: 8080
            - name: metrics
              containerPort: 9090
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
{{- if .Values.router.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.router.clientNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet probes target the Pod IP directly.
    - ports:
        - protocol: TCP
          port: 8081
{{- end }}
{{- end }}
