{{- if .Values.mikan.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mikan.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mikan.labels" . | nindent 4 }}
data:
  settings.json: |
    {
      "llm": {
        "provider": {{ .Values.mikan.settings.provider | quote }},
        "model": {{ .Values.mikan.settings.model | quote }},
        "thinkingLevel": {{ .Values.mikan.settings.thinkingLevel | quote }}
      }{{- if .Values.agentSandbox.enabled }},
      "sandbox": {
        "agentSandbox": {
          "namespace": {{ .Release.Namespace | quote }},
          "runtimeClassName": {{ .Values.agentSandbox.runtimeClassName | quote }},
          "apiUrl": {{ .Values.router.apiUrl | quote }},
          "routerNamespace": {{ .Values.router.namespace | quote }},
          "sandboxReadyTimeout": {{ .Values.agentSandbox.readyTimeout }}
        }
      }{{- end }}
    }
{{- end }}
