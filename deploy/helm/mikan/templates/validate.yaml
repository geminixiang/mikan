{{- if and .Values.mikan.enabled (eq .Values.mikan.sandbox.mode "agent-sandbox") (not .Values.agentSandbox.enabled) }}
{{- fail "agentSandbox.enabled must be true when mikan.sandbox.mode=agent-sandbox" }}
{{- end }}
{{- if and .Values.mikan.enabled (eq .Values.mikan.sandbox.mode "host") .Values.agentSandbox.enabled }}
{{- fail "agentSandbox.enabled must be false when mikan.sandbox.mode=host" }}
{{- end }}
{{- if and .Values.agentSandbox.enabled (ne .Values.agentSandbox.runtimeClassName "kata-qemu") }}
{{- fail "mikan requires agentSandbox.runtimeClassName=kata-qemu; runc fallback is not allowed" }}
{{- end }}
{{- if and .Values.agentSandbox.enabled (not (has "ReadWriteMany" .Values.storage.workspace.accessModes)) }}
{{- fail "Agent Sandbox requires ReadWriteMany in storage.workspace.accessModes" }}
{{- end }}
{{- if and .Values.agentSandbox.enabled (empty (include "mikan.workspaceStorageClass" .)) (empty .Values.storage.workspace.existingClaim) }}
{{- fail "Agent Sandbox requires storage.workspace.storageClassName, a generated GKE Filestore class, or storage.workspace.existingClaim" }}
{{- end }}
{{- if and .Values.storage.workspace.gkeFilestore.createStorageClass (empty .Values.storage.workspace.gkeFilestore.network) }}
{{- fail "storage.workspace.gkeFilestore.network is required when creating a GKE Filestore StorageClass" }}
{{- end }}
{{- if and .Values.validation.clusterPrerequisites .Values.agentSandbox.enabled .Release.IsInstall }}
  {{- if not (lookup "node.k8s.io/v1" "RuntimeClass" "" .Values.agentSandbox.runtimeClassName) }}
    {{- fail (printf "RuntimeClass %q was not found; install Kata before enabling Agent Sandbox" .Values.agentSandbox.runtimeClassName) }}
  {{- end }}
  {{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "sandboxtemplates.extensions.agents.x-k8s.io") }}
    {{- fail "Agent Sandbox extension CRDs were not found; install the pinned controller/extensions first" }}
  {{- end }}
{{- end }}
