# GKE Standard profile. Set the VPC explicitly at install time:
# --set storage.workspace.gkeFilestore.network=my-vpc
mikan:
  sandbox:
    mode: agent-sandbox
agentSandbox:
  enabled: true
  runtimeClassName: kata-qemu
storage:
  workspace:
    accessModes:
      - ReadWriteMany
    storageClassName: ""
    gkeFilestore:
      createStorageClass: true
      network: ""
      tier: standard
