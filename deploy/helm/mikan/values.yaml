nameOverride: ""
fullnameOverride: ""

mikan:
  enabled: true
  image:
    repository: ghcr.io/geminixiang/mikan
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  sandbox:
    mode: host
  settings:
    provider: anthropic
    model: claude-sonnet-4-6
    thinkingLevel: off
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

agentSandbox:
  enabled: false
  runtimeClassName: kata-qemu
  readyTimeout: 300
  service: true
  runtimeImage:
    repository: ghcr.io/geminixiang/mikan-agent-sandbox-runtime
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "4"
      memory: 8Gi
      ephemeral-storage: 50Gi
  warmPool:
    replicas: 0

router:
  enabled: false
  namespace: agent-sandbox-system
  apiUrl: http://sandbox-router-svc.agent-sandbox-system.svc:8080
  image:
    repository: ghcr.io/geminixiang/mikan-agent-sandbox-router
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  clientNamespace: mikan
  networkPolicy:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

storage:
  retainClaims: true
  fixOwnership: true
  ownershipImage: busybox:1.37.0
  workspace:
    create: true
    existingClaim: ""
    storageClassName: ""
    size: 100Gi
    accessModes:
      - ReadWriteOnce
    gkeFilestore:
      createStorageClass: false
      storageClassName: ""
      network: ""
      tier: standard
  state:
    create: true
    existingClaim: ""
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

secrets:
  mikanEnv:
    existingSecretName: mikan-env
  harnessAuth:
    existingSecretName: ""

serviceAccount:
  create: true
  name: ""

validation:
  clusterPrerequisites: true
