apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: mikan-kata
  namespace: mikan
spec:
  # Required by the v0.5.2 router DNS fallback. The TypeScript SDK's direct
  # apiUrl transport does not send X-Sandbox-UID for the router cache path.
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: mikan-agent-sandbox
    spec:
      runtimeClassName: kata-qemu
      containers:
        - name: runtime
          image: asia-east1-docker.pkg.dev/glab-384109/glab/mikan-agent-sandbox-runtime@sha256:148429e17322c69506d561f1f492ff2ddeee57d91e581e4de940cf72a3bbe943
          ports:
            - name: sandbox-api
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: sandbox-api
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mikan-workspace
      restartPolicy: Never
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: mikan-kata
  namespace: mikan
spec:
  # Start cold to avoid paying for idle Kata VMs. Increase after measuring
  # browser startup latency and cluster capacity.
  replicas: 0
  sandboxTemplateRef:
    name: mikan-kata
