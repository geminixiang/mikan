<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mikan architecture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        background: #fbfaf7;
        border-radius: 36px;
        overflow: hidden;
      }
      text {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        fill: #233044;
      }
      .title {
        font-size: 44px;
        font-weight: 600;
      }
      .subtitle {
        font-size: 22px;
        fill: #60738c;
      }
      .heading {
        font-size: 25px;
        font-weight: 600;
      }
      .body {
        font-size: 21px;
      }
      .small {
        font-size: 18px;
        fill: #60738c;
      }
      .edge {
        fill: none;
        stroke: #60738c;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .return {
        fill: none;
        stroke: #b35b32;
        stroke-width: 3;
        marker-end: url(#orange);
      }
      .dashed {
        stroke-dasharray: 9 7;
      }
      .box {
        stroke-width: 2.5;
        rx: 22;
      }
      .label {
        font-size: 17px;
        fill: #526681;
        paint-order: stroke;
        stroke: #fbfaf7;
        stroke-width: 9;
        stroke-linejoin: round;
      }
      .orange-label {
        fill: #a6512b;
      }
      .boundary {
        fill: none;
        stroke: #c7d2c2;
        stroke-width: 2;
        stroke-dasharray: 10 8;
        rx: 25;
      }
      @media print {
        @page {
          size: landscape;
          margin: 0;
        }
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 2200 1280"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">
        mikan architecture — platform conversations, Pi v4 sessions and authorized execution
      </title>
      <desc id="diagram-description">
        Platform adapters send messages through intake to ConversationRuntime and SessionLifecycle,
        then runner and Pi AgentHarness. Pi owns the model and tool loop. SessionStore owns the
        session file writer. Tools execute through an authorized ExecutionEnv in the sandbox.
        Presenter and responder return results to the platform. Slack DM tasks use independent
        thread sessions; subagents use in-memory sessions. Vault and Office projection supply
        execution authority. Sentry and OTLP receive content-free diagnostics.
      </desc>
      <defs>
        <marker
          id="arrow"
          markerWidth="10"
          markerHeight="10"
          refX="9"
          refY="5"
          orient="auto"
          markerUnits="userSpaceOnUse"
        >
          <path d="M0 0 L10 5 L0 10Z" fill="#60738c" />
        </marker>
        <marker
          id="orange"
          markerWidth="10"
          markerHeight="10"
          refX="9"
          refY="5"
          orient="auto"
          markerUnits="userSpaceOnUse"
        >
          <path d="M0 0 L10 5 L0 10Z" fill="#b35b32" />
        </marker>
      </defs>
      <text x="70" y="77" class="title">mikan architecture</text>
      <text x="70" y="120" class="subtitle">Conversations → Pi execution → sandbox → delivery</text>
      <text x="2130" y="74" text-anchor="end" class="small">1.0.0-beta.61</text>
      <text x="2130" y="106" text-anchor="end" class="small">
        Implemented topology · 2026-09-15
      </text>

      <!-- Office is an identity/resource scope, not another process. -->
      <rect x="400" y="166" width="1730" height="717" class="boundary" />
      <text x="422" y="196" class="small">
        CONVERSATION OFFICE · platform + conversation ID → OfficeKey
      </text>

      <!-- Upper row: state and authority. -->
      <rect x="70" y="235" width="280" height="165" class="box" fill="#f2f3f5" stroke="#cbd1db" />
      <text x="95" y="275" class="heading">Platform adapters</text>
      <text x="95" y="314" class="body">Slack · Discord</text>
      <text x="95" y="346" class="body">Telegram · GitHub</text>
      <text x="95" y="377" class="small">Events · threads · files</text>

      <rect x="435" y="235" width="400" height="165" class="box" fill="#dfeeff" stroke="#93bff2" />
      <text x="460" y="275" class="heading">Conversation data</text>
      <text x="460" y="314" class="body">log.jsonl · attachments/</text>
      <text x="460" y="346" class="body">Workspace files · MEMORY.md</text>
      <text x="460" y="378" class="small">ChatHistorySync → session context</text>

      <rect x="920" y="235" width="510" height="165" class="box" fill="#e9e4fa" stroke="#b8a8eb" />
      <text x="945" y="275" class="heading">SessionStore → Pi session v4</text>
      <text x="945" y="314" class="body">JSONL · single writer</text>
      <text x="945" y="346" class="body">Entries / main lane / inbox / operations</text>
      <text x="945" y="378" class="small">mikan paths · Pi persistence</text>

      <rect x="1720" y="235" width="375" height="165" class="box" fill="#fff6c9" stroke="#e8cf70" />
      <text x="1745" y="275" class="heading">Office + Vault</text>
      <text x="1745" y="314" class="body">Door policy · workspace mounts</text>
      <text x="1745" y="346" class="body">Authorized credentials / files</text>
      <text x="1745" y="378" class="small">ActorExecutionResolver</text>

      <!-- Main execution row. -->
      <rect x="70" y="485" width="280" height="230" class="box" fill="#f2f3f5" stroke="#cbd1db" />
      <text x="95" y="525" class="heading">Conversation intake</text>
      <text x="95" y="566" class="body">Trigger / access policy</text>
      <text x="95" y="600" class="body">stop bypasses queue</text>
      <text x="95" y="634" class="body">Normalized events</text>
      <text x="95" y="677" class="small">Platform-specific busy policy</text>

      <rect x="435" y="485" width="400" height="230" class="box" fill="#dff5e6" stroke="#88cda0" />
      <text x="460" y="525" class="heading">Conversation runtime</text>
      <text x="460" y="566" class="body">ConversationRuntime</text>
      <text x="460" y="600" class="body">SessionLifecycle · command dispatch</text>
      <text x="460" y="634" class="body">Queue / lease / stop / settlement</text>
      <text x="460" y="677" class="small">Serial per OfficeAddress + sessionKey</text>

      <rect x="920" y="485" width="300" height="230" class="box" fill="#dff5e6" stroke="#88cda0" />
      <text x="945" y="525" class="heading">Runner</text>
      <text x="945" y="566" class="body">Prompt + skills</text>
      <text x="945" y="600" class="body">Actor / tool binding</text>
      <text x="945" y="634" class="body">Budgets / presentation</text>
      <text x="945" y="677" class="small">PiAgentWrapper</text>

      <rect x="1285" y="485" width="335" height="230" class="box" fill="#e9e4fa" stroke="#b8a8eb" />
      <text x="1310" y="525" class="heading">Pi AgentHarness</text>
      <text x="1310" y="566" class="body">pi-ai → model providers</text>
      <text x="1310" y="600" class="body">Model / tool loop</text>
      <text x="1310" y="634" class="body">Retry / compact / steer / abort</text>
      <text x="1310" y="677" class="small">Native read · write · edit · bash</text>

      <rect x="1720" y="485" width="375" height="230" class="box" fill="#ffecd7" stroke="#ecb078" />
      <text x="1745" y="525" class="heading">Sandbox execution</text>
      <text x="1745" y="566" class="body">Authorized ExecutionEnv</text>
      <text x="1745" y="600" class="body">Executor → filesystem / shell</text>
      <text x="1745" y="634" class="body">Host · container · managed image</text>
      <text x="1745" y="677" class="small">Cloudflare experimental · no env fallback</text>

      <!-- Connections: arrows have reserved gutters, never run through text. -->
      <path d="M350 312 H435" class="edge" />
      <text x="388" y="297" text-anchor="middle" class="label">record</text>
      <path d="M210 400 V485" class="edge" />
      <text x="227" y="449" class="label">event</text>
      <path d="M350 598 H435" class="edge" />
      <path d="M635 400 V485" class="edge" />
      <text x="650" y="449" class="label">sync history</text>
      <path d="M835 315 H920" class="edge" />
      <path d="M835 598 H920" class="edge" />
      <text x="877" y="581" text-anchor="middle" class="label">run</text>
      <path d="M1220 598 H1285" class="edge" />
      <path d="M1430 330 H1450 V485" class="edge" />
      <text x="1467" y="442" class="label">persist / restore</text>
      <path d="M1620 598 H1720" class="edge" />
      <text x="1670" y="580" text-anchor="middle" class="label">tools</text>
      <path d="M1907 400 V485" class="edge" />
      <text x="1923" y="449" class="label">authorize</text>

      <!-- Explicit return path. -->
      <rect x="690" y="778" width="840" height="72" class="box" fill="#fff4e9" stroke="#dfab86" />
      <text x="1110" y="808" text-anchor="middle" class="heading">
        Presenter → ConversationResponder
      </text>
      <text x="1110" y="835" text-anchor="middle" class="small">
        Progress · final delivery · files · requester notification
      </text>
      <path d="M1450 715 V778" class="return" />
      <path d="M690 813 H44 V318 H70" class="return" />
      <text x="448" y="798" class="label orange-label">reply / notify</text>

      <!-- Bottom row: separate concepts, succinct labels. -->
      <rect x="70" y="935" width="650" height="225" class="box" fill="#ffffff" stroke="#cbd6e4" />
      <text x="95" y="977" class="heading">Slack DM tasks</text>
      <text x="95" y="1015" class="body">Main DM → start_task → task thread</text>
      <text x="95" y="1049" class="body">Independent session + runner</text>
      <text x="95" y="1083" class="body">task_status · steer · stop</text>
      <text x="95" y="1124" class="small">One v4 file / main lane per session</text>

      <rect x="760" y="935" width="620" height="225" class="box" fill="#ffffff" stroke="#cbd6e4" />
      <text x="785" y="977" class="heading">Other execution paths</text>
      <text x="785" y="1015" class="body">Events / Web → conversation runtime</text>
      <text x="785" y="1049" class="body">Subagents → in-memory · parent awaits</text>
      <text x="785" y="1083" class="body">Dream → in-memory · memory maintenance</text>
      <text x="785" y="1124" class="small">Shared office workspace</text>

      <rect x="1420" y="935" width="675" height="225" class="box" fill="#ffffff" stroke="#cbd6e4" />
      <text x="1445" y="977" class="heading">Observability · Sentry + OTLP</text>
      <text x="1445" y="1015" class="body">Errors · traces · metrics</text>
      <text x="1445" y="1049" class="body">Operational IDs · no content</text>
      <text x="1445" y="1083" class="body">Execution ≠ delivery</text>
      <text x="1445" y="1124" class="small">Opt-in export</text>
      <path d="M1530 813 H1650 V935" class="edge dashed" />
      <text x="1668" y="910" class="label">diagnostics</text>

      <text x="70" y="1223" class="small">
        mikan: routing / authorization / delivery · Pi: execution / persistence
      </text>
    </svg>
  </body>
</html>
